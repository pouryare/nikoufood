# Builds the site image on GitHub and pushes it to Docker Hub.
#   - every pull request: build only (proves the Docker build works, pushes nothing)
#   - push to main, a version tag (v1.0.0) or the "Run workflow" button: build and push
#
# One-time setup (GitHub → repository → Settings → Secrets and variables → Actions → New repository secret):
#   DOCKERHUB_USERNAME   your Docker Hub user name
#   DOCKERHUB_TOKEN      a Docker Hub access token (hub.docker.com → Account settings → Personal access tokens)
name: Docker image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags for the site image
        id: site
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'nikou' }}/nikoufood
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Tags for the tools image
        id: tools
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'nikou' }}/nikoufood-tools
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      # The site itself (small runtime image).
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.site.outputs.tags }}
          labels: ${{ steps.site.outputs.labels }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,scope=site,mode=max

      # The same source with all tools, used only to run database migrations and the starter content.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: tools
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tools.outputs.tags }}
          labels: ${{ steps.tools.outputs.labels }}
          cache-from: type=gha,scope=tools
          cache-to: type=gha,scope=tools,mode=max
