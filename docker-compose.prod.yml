# For the server: it pulls the ready-made images from Docker Hub (nothing is built there).
#   1. cp .env.example .env      and fill it in (DOCKERHUB_USER, DB_PASSWORD, PAYLOAD_SECRET, NEXT_PUBLIC_SITE_URL, SMTP_*)
#   2. docker login              (only if the Docker Hub repositories are private)
#   3. docker compose -f docker-compose.prod.yml pull
#   4. docker compose -f docker-compose.prod.yml up -d
#   5. first time only:  docker compose -f docker-compose.prod.yml run --rm tools pnpm seed
# To update later: repeat steps 3 and 4.
name: nikoufood

x-env: &env
  DATABASE_URL: postgres://nikou:${DB_PASSWORD}@db:5432/nikou
  PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
  NODE_ENV: production
  MEDIA_DIR: /data/media
  FONTS_DIR: /data/media/fonts
  IP_HASH_SALT: ${IP_HASH_SALT:-}
  NOTIFY_EMAILS: ${NOTIFY_EMAILS:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nikou
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: nikou
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nikou']
      interval: 5s
      retries: 10

  migrate:
    image: ${DOCKERHUB_USER:?set DOCKERHUB_USER in .env}/nikoufood-tools:${IMAGE_TAG:-latest}
    command: pnpm migrate
    environment: *env
    depends_on: { db: { condition: service_healthy } }
    restart: 'no'

  app:
    image: ${DOCKERHUB_USER}/nikoufood:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *env
    volumes:
      - media:/data/media
    ports:
      - '127.0.0.1:3000:3000'
    depends_on: { migrate: { condition: service_completed_successfully } }

  tools:
    image: ${DOCKERHUB_USER}/nikoufood-tools:${IMAGE_TAG:-latest}
    profiles: [tools]
    environment: *env
    volumes:
      - media:/data/media
    depends_on: { db: { condition: service_healthy } }

volumes:
  db-data:
  media:
